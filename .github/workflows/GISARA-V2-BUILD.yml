name: GISARA SALES V2 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GISARA V2 project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/gisara/sales
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='GISARA-SALES-V2'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.gisara.sales'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.gisara.sales'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#145291</item>
              <item name="android:statusBarColor">#145291</item>
              <item name="android:navigationBarColor">#F6F8FB</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
            <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
            <application android:theme="@style/AppTheme" android:label="GISARA SALES" android:allowBackup="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/gisara/sales/MainActivity.java <<'EOF'
          package com.gisara.sales;

import android.app.*;
import android.os.*;
import android.Manifest;
import android.content.*;
import android.content.pm.PackageManager;
import android.graphics.Color;
import android.graphics.drawable.GradientDrawable;
import android.bluetooth.*;
import android.database.Cursor;
import android.database.sqlite.*;
import android.view.*;
import android.widget.*;
import java.text.*;
import java.util.*;

public class MainActivity extends Activity {
    DB db;
    LinearLayout content;
    int BLUE=Color.rgb(20,82,145), BG=Color.rgb(246,248,251), DARK=Color.rgb(35,45,55);

    @Override public void onCreate(Bundle b){
        super.onCreate(b);
        db=new DB(this);
        dashboard();
    }

    TextView tv(String s,float z){
        TextView t=new TextView(this); t.setText(s); t.setTextSize(z); t.setTextColor(DARK);
        t.setPadding(18,12,18,12); return t;
    }
    GradientDrawable bg(int c,int r){
        GradientDrawable g=new GradientDrawable(); g.setColor(c); g.setCornerRadius(r); return g;
    }
    Button button(String s,View.OnClickListener l){
        Button b=new Button(this); b.setText(s); b.setAllCaps(false); b.setTextSize(15);
        b.setOnClickListener(l); return b;
    }
    void page(String title){
        LinearLayout root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(BG);
        TextView h=tv("GISARA SALES\n"+title,24); h.setTextColor(BLUE); h.setTypeface(null,1); root.addView(h);
        ScrollView sc=new ScrollView(this); content=new LinearLayout(this); content.setOrientation(LinearLayout.VERTICAL);
        content.setPadding(12,4,12,18); sc.addView(content); root.addView(sc,new LinearLayout.LayoutParams(-1,0,1));
        LinearLayout nav=new LinearLayout(this); nav.setPadding(4,4,4,4); nav.setBackgroundColor(Color.WHITE);
        String[] n={"Dashboard","Data Toko","Kunjungan","Penjualan","Laporan","Produk"};
        for(String x:n){ final String q=x; nav.addView(button(x,v->{switch(q){
            case "Dashboard":dashboard();break; case "Data Toko":stores();break; case "Kunjungan":visits();break;
            case "Penjualan":sales();break; case "Laporan":reports();break; default:products();
        }}),new LinearLayout.LayoutParams(0,64,1));}
        root.addView(nav); setContentView(root);
    }
    void stat(String a,String b){
        TextView t=tv(a+"\n"+b,17); t.setTextColor(Color.WHITE); t.setTypeface(null,1); t.setBackground(bg(BLUE,24));
        content.addView(t,new LinearLayout.LayoutParams(-1,105));
        Space sp=new Space(this); content.addView(sp,new LinearLayout.LayoutParams(1,10));
    }
    void dashboard(){
        page("Dashboard");
        content.addView(tv("Sistem Sales & Customer Visit Management",18));
        stat("TOTAL TOKO",String.valueOf(db.count("stores")));
        stat("KUNJUNGAN HARI INI",String.valueOf(db.today("visits")));
        stat("TRANSAKSI HARI INI",String.valueOf(db.today("sales")));
        stat("PENJUALAN HARI INI","Rp "+db.todaySales());
        content.addView(tv("Aktivitas terbaru",19));
        Cursor c=db.r("SELECT s.name,v.created FROM visits v JOIN stores s ON s.id=v.store_id ORDER BY v.id DESC LIMIT 8");
        while(c.moveToNext()) content.addView(tv("• "+c.getString(0)+"\n  "+c.getString(1),15));
        c.close();
    }
    void stores(){
        page("Data Toko");
        content.addView(button("+ Tambah Toko",v->addStore()));
        Cursor c=db.r("SELECT id,name,owner,phone,address FROM stores ORDER BY name");
        if(!c.moveToFirst()) content.addView(tv("Belum ada toko.",17));
        else do{
            final long id=c.getLong(0); String s=c.getString(1);
            TextView card=tv(s+"\n"+c.getString(2)+" • "+c.getString(3)+"\n"+c.getString(4),16);
            card.setBackground(bg(Color.WHITE,20)); card.setOnClickListener(v->storeDetail(id));
            content.addView(card,new LinearLayout.LayoutParams(-1,120)); Space sp=new Space(this);content.addView(sp,new LinearLayout.LayoutParams(1,8));
        }while(c.moveToNext());
        c.close();
    }
    void addStore(){
        LinearLayout f=new LinearLayout(this); f.setOrientation(LinearLayout.VERTICAL);
        EditText n=e("Nama toko"),o=e("Nama pemilik/kontak"),p=e("Nomor HP"),a=e("Alamat"),k=e("Keterangan");
        f.addView(n);f.addView(o);f.addView(p);f.addView(a);f.addView(k);
        new AlertDialog.Builder(this).setTitle("Tambah Toko").setView(f).setNegativeButton("Batal",null)
        .setPositiveButton("Simpan",(d,w)->{db.addStore(n,o,p,a,k);stores();}).show();
    }
    EditText e(String h){EditText e=new EditText(this);e.setHint(h);return e;}
    void storeDetail(long id){
        Cursor s=db.r("SELECT name,owner,phone,address,note FROM stores WHERE id="+id);
        if(!s.moveToFirst()){s.close();return;}
        String head=s.getString(0), info=s.getString(1)+"\n"+s.getString(2)+"\n"+s.getString(3);
        s.close(); page(head);
        content.addView(tv(info,17));
        content.addView(tv("Riwayat Kunjungan",19));
        Cursor v=db.r("SELECT created FROM visits WHERE store_id="+id+" ORDER BY id DESC");
        while(v.moveToNext())content.addView(tv("• "+v.getString(0),15));v.close();
        content.addView(tv("Riwayat Pembelian",19));
        Cursor z=db.r("SELECT total,created FROM sales WHERE store_id="+id+" ORDER BY id DESC");
        while(z.moveToNext())content.addView(tv("• Rp "+z.getLong(0)+"  |  "+z.getString(1),15));z.close();
    }
    void visits(){
        page("Kunjungan");
        content.addView(tv("Pilih toko yang dikunjungi hari ini.",18));
        Cursor c=db.r("SELECT id,name FROM stores ORDER BY name");
        while(c.moveToNext()){final long id=c.getLong(0);final String n=c.getString(1);
            content.addView(button("📍 "+n,v->{db.visit(id);Toast.makeText(this,"Kunjungan tersimpan",Toast.LENGTH_SHORT).show();visits();}));
        }c.close();
    }
    void sales(){
        page("Penjualan");
        content.addView(tv("Pilih toko untuk membuat transaksi.",18));
        Cursor c=db.r("SELECT id,name FROM stores ORDER BY name");
        while(c.moveToNext()){final long id=c.getLong(0);final String n=c.getString(1);
            content.addView(button("🛒 "+n,v->saleForm(id,n)));
        }c.close();
    }
    void saleForm(long id,String store){
        LinearLayout f=new LinearLayout(this);f.setOrientation(LinearLayout.VERTICAL);
        EditText amount=e("Total penjualan (Rp)");amount.setInputType(2);f.addView(amount);
        new AlertDialog.Builder(this).setTitle("Penjualan • "+store).setView(f).setNegativeButton("Batal",null)
        .setPositiveButton("Simpan",(d,w)->{long x=0;try{x=Long.parseLong(amount.getText().toString());}catch(Exception q){}
            db.sale(id,x);Toast.makeText(this,"Transaksi tersimpan",Toast.LENGTH_SHORT).show();sales();
        }).show();
    }
    void products(){
        page("Produk");content.addView(button("+ Tambah Produk",v->addProduct()));
        Cursor c=db.r("SELECT name,price,unit FROM products ORDER BY name");
        if(!c.moveToFirst())content.addView(tv("Belum ada produk.",17));
        else do{content.addView(tv(c.getString(0)+"\nRp "+c.getLong(1)+" / "+c.getString(2),16));}while(c.moveToNext());c.close();
    }
    void addProduct(){
        LinearLayout f=new LinearLayout(this);f.setOrientation(LinearLayout.VERTICAL);
        EditText n=e("Nama produk"),p=e("Harga"),u=e("Satuan");p.setInputType(2);f.addView(n);f.addView(p);f.addView(u);
        new AlertDialog.Builder(this).setTitle("Tambah Produk").setView(f).setNegativeButton("Batal",null)
        .setPositiveButton("Simpan",(d,w)->{long x=0;try{x=Long.parseLong(p.getText().toString());}catch(Exception q){}
            db.product(n,x,u);products();}).show();
    }
    void reports(){
        page("Laporan Harian");
        content.addView(tv("Ringkasan hari ini",20));
        content.addView(tv("Toko dikunjungi : "+db.today("visits")+"\nTransaksi : "+db.today("sales")+"\nTotal penjualan : Rp "+db.todaySales(),18));
        content.addView(button("🖨 Cetak Laporan",v->Toast.makeText(this,"Fitur printer akan dihubungkan berikutnya.",Toast.LENGTH_LONG).show()));
    }

    static class DB extends SQLiteOpenHelper{
        DB(Context c){super(c,"gisara_v2.db",null,1);}
        public void onCreate(SQLiteDatabase d){
            d.execSQL("CREATE TABLE stores(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT,owner TEXT,phone TEXT,address TEXT,note TEXT)");
            d.execSQL("CREATE TABLE products(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT,price INTEGER,unit TEXT)");
            d.execSQL("CREATE TABLE visits(id INTEGER PRIMARY KEY AUTOINCREMENT,store_id INTEGER,created TEXT)");
            d.execSQL("CREATE TABLE sales(id INTEGER PRIMARY KEY AUTOINCREMENT,store_id INTEGER,total INTEGER,created TEXT)");
        }
        public void onUpgrade(SQLiteDatabase d,int a,int b){}
        String now(){return new SimpleDateFormat("yyyy-MM-dd HH:mm:ss",Locale.US).format(new Date());}
        Cursor r(String q){return getReadableDatabase().rawQuery(q,null);}
        int count(String t){Cursor c=r("SELECT COUNT(*) FROM "+t);c.moveToFirst();int x=c.getInt(0);c.close();return x;}
        int today(String t){Cursor c=r("SELECT COUNT(*) FROM "+t+" WHERE date(created)=date('now','localtime')");c.moveToFirst();int x=c.getInt(0);c.close();return x;}
        long todaySales(){Cursor c=r("SELECT COALESCE(SUM(total),0) FROM sales WHERE date(created)=date('now','localtime')");c.moveToFirst();long x=c.getLong(0);c.close();return x;}
        void addStore(EditText n,EditText o,EditText p,EditText a,EditText k){ContentValues v=new ContentValues();v.put("name",n.getText().toString());v.put("owner",o.getText().toString());v.put("phone",p.getText().toString());v.put("address",a.getText().toString());v.put("note",k.getText().toString());getWritableDatabase().insert("stores",null,v);}
        void visit(long id){ContentValues v=new ContentValues();v.put("store_id",id);v.put("created",now());getWritableDatabase().insert("visits",null,v);}
        void sale(long id,long x){ContentValues v=new ContentValues();v.put("store_id",id);v.put("total",x);v.put("created",now());getWritableDatabase().insert("sales",null,v);}
        void product(EditText n,long x,EditText u){ContentValues v=new ContentValues();v.put("name",n.getText().toString());v.put("price",x);v.put("unit",u.getText().toString());getWritableDatabase().insert("products",null,v);}
    }
}

          EOF

          echo "" | base64 -d > app/src/main/res/drawable/gisara_logo.png

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GISARA-SALES-V2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
